about:
  label: About the Section
  title: Media & Website Section
  text: |-
    The Media & Website Section supports the Institute's digital presence,
    media communication and audiovisual requirements. The section works with
    departments, schools, centres, faculty, staff and other Institute units to
    support effective communication and digital content.
  ctaLabel: Learn More →
  ctaHref: /about
  stats:
    - number: 5+
      label: Departments Supported
    - number: 24/7
      label: Digital Support
services:
  label: What We Do
  title: Our Services
  subtitle: Comprehensive media, website and digital communication support for the
    Institute.
  items:
    - number: "01"
      title: Website Management
      description: Design, development and maintenance of Institute websites. Content
        management, hosting support and technical assistance for departments and
        units.
      href: /website
    - number: "02"
      title: Media & Photography
      description: Professional photography and videography for Institute events,
        campus life, official communications and promotional content.
      href: /media
    - number: "03"
      title: Audio-Visual Support
      description: Setup and management of audio-visual equipment for seminars,
        conferences, meetings and other Institute events.
      href: /av-support
    - number: "04"
      title: Digital Communication
      description: Support for digital newsletters, social media presence, online
        announcements and other Institute communication channels.
      href: /services
